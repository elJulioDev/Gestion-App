{% extends "gestion/base.html" %}
{% load static %}

{% block title %}Pawchive Gallery{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/galeria.css' %}">{% endblock %}

{% block content %}
<header class="topbar">
    <div class="topbar-inner">
        <div class="topbar-left">
            <a href="{% url 'gestion:marcadores' %}" class="btn btn-ghost btn-icon" title="Volver">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
                    <path fill-rule="evenodd" d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06z"/>
                </svg>
            </a>
            <span class="topbar-brand">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.28 5.22a.75.75 0 0 1 0 1.06l-2.22 2.22 2.22 2.22a.75.75 0 1 1-1.06 1.06L7.5 9.06l-2.72 2.72a.75.75 0 1 1-1.06-1.06l2.72-2.72-2.72-2.72a.75.75 0 0 1 1.06-1.06L7.5 6.94l2.22-2.22a.75.75 0 0 1 1.06 0z"/>
                </svg>
                <span id="pw-creator-name">Pawchive</span>
            </span>
        </div>
        <div class="topbar-center">
            <div class="search-wrapper">
                <svg class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04zm-5.68.26a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9z"/>
                </svg>
                <input class="search-input" id="pw-search" type="text"
                       placeholder="Buscar posts…" autocomplete="off">
                <button class="search-clear" id="pw-clear" style="display:none">
                    <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1-1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="topbar-right">
            <span class="pw-post-count" id="pw-post-count"></span>
            <div class="topbar-divider"></div>
            <form method="post" action="{% url 'gestion:logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost btn-sm" title="Cerrar sesión">
                    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M2 2.75C2 1.784 2.784 1 3.75 1h4a.75.75 0 0 1 0 1.5h-4a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h4a.75.75 0 0 1 0 1.5h-4A1.75 1.75 0 0 1 2 13.25V2.75zm9.44 4.5-1.97-1.97a.75.75 0 0 1 1.06-1.06l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 1 1-1.06-1.06l1.97-1.97H6.75a.75.75 0 0 1 0-1.5z"/></svg>
                    <span class="logout-label">Salir</span>
                </button>
            </form>
        </div>
    </div>
</header>

<main class="pw-main" id="pw-main">
    <div class="pw-empty" id="pw-empty">
        <svg width="40" height="40" viewBox="0 0 16 16" fill="currentColor" style="opacity:.2">
            <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.28 5.22a.75.75 0 0 1 0 1.06l-2.22 2.22 2.22 2.22a.75.75 0 1 1-1.06 1.06L7.5 9.06l-2.72 2.72a.75.75 0 1 1-1.06-1.06l2.72-2.72-2.72-2.72a.75.75 0 0 1 1.06-1.06L7.5 6.94l2.22-2.22a.75.75 0 0 1 1.06 0z"/>
        </svg>
        <p>Cargando posts…</p>
    </div>
    <div class="pw-spinner" id="pw-spinner" style="display:none">
        <div class="pw-spinner-ring"></div>
    </div>
    <div class="pw-error" id="pw-error" style="display:none">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" style="color:var(--red)">
            <path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.14.22.331.22.53v6a.749.749 0 0 1-.22.53l-4.25 4.25A.749.749 0 0 1 11 16H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/>
        </svg>
        <p id="pw-error-msg">Error al cargar</p>
    </div>
    <div class="pw-grid" id="pw-grid" style="display:none"></div>
    <div class="pw-load-more" id="pw-load-more" style="display:none">
        <button class="btn btn-secondary btn-sm" id="pw-load-more-btn">Cargar más</button>
    </div>
</main>

<!-- Lightbox -->
<div class="pw-lightbox" id="pw-lightbox">
    <button class="pw-lightbox-close" id="pw-lightbox-close" title="Cerrar (Esc)">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1-1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06z"/>
        </svg>
    </button>
    <button class="pw-lightbox-prev" id="pw-lightbox-prev" title="Anterior (←)">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 1.06L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06z"/>
        </svg>
    </button>
    <button class="pw-lightbox-next" id="pw-lightbox-next" title="Siguiente (→)">
        <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M8.22 2.97a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06l2.97-2.97H1.75a.75.75 0 0 1 0-1.5h9.44L8.22 4.03a.75.75 0 0 1 0-1.06z"/>
        </svg>
    </button>
    <div class="pw-lightbox-content" id="pw-lightbox-content">
        <div class="pw-lightbox-loading" id="pw-lightbox-loading">
            <div class="pw-lightbox-spinner"></div>
        </div>
        <img class="pw-lightbox-img" id="pw-lightbox-img" src="" alt="">
    </div>
    <div class="pw-lightbox-info" id="pw-lightbox-info">
        <span class="pw-lightbox-title" id="pw-lightbox-title"></span>
        <span class="pw-lightbox-counter" id="pw-lightbox-counter"></span>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>
{% endblock %}

{% block extra_js %}
<script>
const PW_CONFIG = {
    service:    "{{ service }}",
    creatorId:  "{{ creator_id }}",
    postsUrl:   "{% url 'gestion:gallery_posts_proxy' service=service creator_id=creator_id %}",
    profileUrl: "{% url 'gestion:gallery_profile_proxy' service=service creator_id=creator_id %}",
    csrfToken:  "{{ csrf_token }}",
};
</script>
<script src="{% static 'script/galeria.js' %}"></script>
{% endblock %}
