{% extends "gestion/base.html" %}
{% load static %}

{% block title %}Reproductor{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/reproductor.css' %}">{% endblock %}

{% block content %}
<div class="rp-wrapper">
    <iframe id="video-iframe"
            src="{{ embed_url }}"
            allowfullscreen
            allow="autoplay; fullscreen; picture-in-picture"
            frameborder="0"
            scrolling="no">
    </iframe>

    <button class="rp-close" id="rp-close" title="Cerrar (Esc)">
        <i data-lucide="x" style="width:20px;height:20px"></i>
    </button>
</div>

<script>
(function() {
    const iframe  = document.getElementById('video-iframe');
    const closeBtn = document.getElementById('rp-close');

    /* ── focus iframe on load ─────────────────────────────── */
    iframe.addEventListener('load', () => {
        try { iframe.contentWindow.focus(); } catch {}
    });

    /* ── keyboard shortcuts ───────────────────────────────── */
    document.addEventListener('keydown', e => {
        switch (e.key) {
            case 'Escape':
                e.preventDefault();
                history.back();
                break;
        }
    });

    /* ── close button ─────────────────────────────────────── */
    closeBtn.addEventListener('click', () => history.back());

    /* ── init icons ───────────────────────────────────────── */
    if (typeof lucide !== 'undefined') lucide.createIcons({ nodes: [closeBtn] });

    /* ── auto-focus ───────────────────────────────────────── */
    window.addEventListener('load', () => {
        try { iframe.contentWindow.focus(); } catch {}
    });
})();
</script>
{% endblock %}
