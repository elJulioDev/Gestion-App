{% extends "gestion/base.html" %}

{% block title %}Dashboard — Gestión{% endblock %}

{% block content %}
{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

<h1>Hola mundo</h1>
<form method="post" action="{% url 'gestion:logout' %}">
    {% csrf_token %}
    <button type="submit">Cerrar sesión</button>
</form>
{% endblock %}
